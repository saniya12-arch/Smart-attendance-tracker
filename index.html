<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Attendance Dashboard</title>

<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

  <h2>📊 Attendance Dashboard</h2>

  <!-- INPUT SECTION -->
  <div class="inputs">

    <input id="total" placeholder="Total Students">
    <input id="present" placeholder="Present Today">
    <input id="absent" placeholder="Absent Today">
    <input id="late" placeholder="Late Students">

    <input id="male" placeholder="Male Students">
    <input id="female" placeholder="Female Students">

    <input id="top1" placeholder="Top Student 1 %">
    <input id="top2" placeholder="Top Student 2 %">
    <input id="top3" placeholder="Top Student 3 %">
    <input id="top4" placeholder="Top Student 4 %">
    <input id="top5" placeholder="Top Student 5 %">

    <button onclick="generate()">Generate Dashboard</button>

  </div>

  <!-- CARDS -->
  <div class="cards">

    <div class="card">
      <h4>Total Students</h4>
      <p id="c_total">0</p>
    </div>

    <div class="card green">
      <h4>Present</h4>
      <p id="c_present">0</p>
    </div>

    <div class="card red">
      <h4>Absent</h4>
      <p id="c_absent">0</p>
    </div>

    <div class="card yellow">
      <h4>Late</h4>
      <p id="c_late">0</p>
    </div>

  </div>

  <!-- CHARTS -->
  <div class="charts">

    <canvas id="attendanceChart"></canvas>
    <canvas id="genderChart"></canvas>
    <canvas id="topChart"></canvas>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
