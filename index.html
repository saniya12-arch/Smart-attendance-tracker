  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Attendance Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>⚡ ATTENDED</h2>
    <ul>
      <li class="active">Dashboard</li>
      <li>Manage Attendance</li>
      <li>Students</li>
      <li>Reports</li>
    </ul>
  </div>

  <!-- MAIN -->
  <div class="main">

    <h2>Hello Saniya 👋</h2>

    <!-- INPUT -->
    <div class="input-box">
      <input type="number" id="total" placeholder="Total Students">
      <input type="number" id="present" placeholder="Present">
      <input type="number" id="late" placeholder="Late">
      <button onclick="updateDashboard()">Update</button>
    </div>

    <!-- CARDS -->
    <div class="cards">

      <div class="card">
        <h3>Total</h3>
        <p id="totalDisplay">0</p>
      </div>

      <div class="card green">
        <h3>Present</h3>
        <p id="presentDisplay">0</p>
      </div>

      <div class="card red">
        <h3>Absent</h3>
        <p id="absentDisplay">0</p>
      </div>

      <div class="card yellow">
        <h3>Late</h3>
        <p id="lateDisplay">0</p>
      </div>

    </div>

    <!-- CHARTS -->
    <div class="charts">

      <div class="chart-box">
        <h3>Total Attendance Report</h3>
        <canvas id="barChart"></canvas>
      </div>

      <div class="chart-box">
        <h3>Weekly Absent</h3>
        <canvas id="lineChart"></canvas>
      </div>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
